{{- $name := printf "%s-backend" .Release.Name -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret.name }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          ports:
            - containerPort: {{ .Values.backend.servicePort }}
          env:
            - name: DATABASE_URL
              value: "{{ .Values.backend.env.DATABASE_URL }}"
            - name: DATABASE_HOST
              value: "{{ .Values.backend.env.DATABASE_HOST }}"
            - name: DATABASE_USER
              value: "{{ .Values.backend.env.DATABASE_USER }}"
            - name: DATABASE_PASSWORD
              value: "{{ .Values.backend.env.DATABASE_PASSWORD }}"
            - name: DATABASE_NAME
              value: "{{ .Values.backend.env.DATABASE_NAME }}"
            - name: IMAGE_VERSION
              value: "{{ .Values.backend.image.tag }}"
            - name: FRONTEND_IMAGE_VERSION
              value: "{{ .Values.frontend.image.tag }}"
